name: Trigger auto deployment for sm

on:
  workflow_run:
    workflows: [".NET and Jest Build and Test"]
    types:
      - completed

  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SM_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SM_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SM_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SM_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SM_REGISTRY_PASSWORD }}
          containerAppName: sm
          resourceGroup: fathy-calc_group
          imageToBuild: fathyattia/sm:${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_

      - name: Trigger Selenium Tests After Publish
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TEST_REPO_TOKEN }}
          repository: fathi-attia/calc-test
          event-type: dotnet_deploy_success